<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Proyecto de Movilidad Motorizada – Vídeos</title>

  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="css/estilos.css" />

  <style>
    /* Reglas específicas solo para vídeos */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .video-box {
      background: #f7f7f7;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    .video-box video {
      width: 100%;
      border-radius: 4px;
    }

    .video-box p {
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ✅ ENCABEZADO -->
<header>
  <div class="top-logos">
    <img src="bienestar.jpg" alt="Consejería de Bienestar Social" />
    <img src="maestre.jpg" alt="Logo IES Maestre de Calatrava" />
    <img src="educacion.jpg" alt="Consejería de Educación, Cultura y Deportes" />
  </div>
  <div class="title-container">
    <h1>Proyecto de Movilidad Motorizada</h1>
    <h2>Registro audiovisual de sesiones</h2>
  </div>
</header>

<!-- ✅ MENÚ -->
<nav class="menu">
    <ul>
      <li><a href="indexUsuario.html">Volver</a></li>
      <li id="ocultar"><a href="#">Seleccionar paciente</a></li>
      <select id="usuarioSelect">
        <option value="">Cargando paciente...</option>
      </select>

      <li>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
          style="vertical-align: middle; margin-right: 6px;">
          <path d="M12 12c2.7 0 4.5-2 4.5-4.5S14.7 3 12 3 
                   7.5 5 7.5 7.5 9.3 12 12 12zm0 2
                   c-3 0-9 1.5-9 4.5V21h18v-2.5
                   c0-3-6-4.5-9-4.5z" />
        </svg>
        <span id="nombreUsuario"></span>


        <button id="cerrarSesionBtn" class="btn-logout">
          ⛔ Logout
        </button>
      </li>

    </ul>
  </nav>

<!-- ✅ CONTENIDO PRINCIPAL -->
<main>
  <section class="charts-container">
    <article>
      <h2>🎥 Vídeos de las sesiones</h2>
      <p>
        A continuación se muestran los vídeos subidos por los usuarios a
        Firebase Storage, organizados por usuario.
      </p>
      <div id="videos-container"></div>
    </article>
  </section>
</main>

<!-- ✅ PIE -->
<footer>
  <p>© 2026 Proyecto Movilidad Motorizada</p>
</footer>
<script type="module" src="js/videos.js"></script>
</body>
</html>
